[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "A private, 100% local personal assistant: open-source LLM agents over your Obsidian vault. Zero cloud, zero API keys, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Felipe Machado" }]
keywords = ["ai", "automation", "personal-assistant", "obsidian", "ollama", "mistral", "local-first", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]

# Jarvis has zero runtime dependencies — it uses only the Python standard
# library (urllib to talk to Ollama on localhost). This list stays empty on
# purpose; it is the project's headline feature.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "black>=24", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/felipemachado/jarvis"
Repository = "https://github.com/felipemachado/jarvis"
Issues = "https://github.com/felipemachado/jarvis/issues"

[tool.setuptools]
packages = ["core", "core.sources", "agents", "runners"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E402 (import not at top) is intentional: runners/agents insert the repo root
# on sys.path before importing local packages, so they can run as scripts.
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
